<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBACF9"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#000319"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)"/>
  <!-- Subtle inner glow -->
  <rect width="32" height="32" rx="8" fill="none" stroke="#CBACF9" stroke-width="0.6" opacity="0.3"/>
  <!-- Letter B -->
  <text
    x="16" y="23"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="22"
    font-weight="900"
    fill="url(#grad)"
    text-anchor="middle"
    letter-spacing="-1"
  >B</text>
</svg>
